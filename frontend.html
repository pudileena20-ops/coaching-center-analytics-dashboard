<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>City Hospital - Sarah AI Receptionist</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        rel="stylesheet">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        /* =========================
           MAIN AI RING
        ========================== */

        .glowing-ring {

            position: relative;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: #000;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 10;
        }

        .glowing-ring::before {

            content: '';

            position: absolute;

            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;

            background:
                conic-gradient(
                    #f472b6,
                    #a78bfa,
                    #60a5fa,
                    #f472b6
                );

            border-radius: 50%;

            z-index: -1;

            filter: blur(20px);

            opacity: 0.6;

            transition: all 0.5s ease;
        }

        .ring-idle::before {

            animation:
                rotate-slow 10s linear infinite,
                breathe 4s ease-in-out infinite;
        }

        .ring-listening::before {

            filter: blur(30px);

            opacity: 0.9;

            animation:
                rotate-fast 2s linear infinite;
        }

        .ring-speaking::before {

            filter: blur(25px);

            opacity: 0.9;

            animation:
                pulse-speak 1.2s infinite ease-in-out;
        }

        @keyframes rotate-slow {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes rotate-fast {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes pulse-speak {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 640px) {

            .glowing-ring {
                width: 230px;
                height: 230px;
            }

            .glowing-inner {
                width: 220px !important;
                height: 220px !important;
            }

            #status-icon {
                font-size: 4rem !important;
            }
        }

    </style>

</head>


<body class="bg-gray-100 h-screen w-screen overflow-hidden">

====================================================== -->

<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>


/* =====================================================
   CONFIGURATION
====================================================== */

const API_URL = "http://127.0.0.1:8000";


/* =====================================================
   GLOBAL VARIABLES
====================================================== */

let sessionId = null;

let recognition = null;

let isRecording = false;

let currentAudio = null;

let audioContext = null;

let currentSource = null;

let timerInterval = null;

let callActive = false;

let isProcessing = false;


/* =====================================================
   DOM ELEMENTS
====================================================== */

const dashboard =
    document.getElementById("dashboard-screen");

const callScreen =
    document.getElementById("call-screen");

const startCallBtn =
    document.getElementById("start-call-btn");

const endCallBtn =
    document.getElementById("end-call-btn");

const muteBtn =
    document.getElementById("mute-toggle");

const muteIcon =
    document.getElementById("mute-icon");

const langSelect =
    document.getElementById("language-select");

const inputName =
    document.getElementById("input-name");

const inputEmail =
    document.getElementById("input-email");

const visualRing =
    document.getElementById("visual-ring");

const statusIcon =
    document.getElementById("status-icon");

const agentStatus =
    document.getElementById("agent-status");

const transcriptBox =
    document.getElementById("transcript-box");

const transcriptText =
    document.getElementById("transcript-text");

const callTimer =
    document.getElementById("call-timer");

const browserMessage =
    document.getElementById("browser-message");


/* =====================================================
   CONSOLE
====================================================== */

console.log("======================================");
console.log("Sarah AI Receptionist Frontend Loaded");
console.log("API:", API_URL);
console.log("======================================");


/* =====================================================
   SPEECH RECOGNITION
====================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    browserMessage.innerText =
        "Voice recognition is not supported. Please use Microsoft Edge or Chrome.";

    console.error(
        "❌ Speech Recognition not supported"
    );

} else {

    console.log(
        "✅ Speech Recognition supported"
    );

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;


    recognition.onstart = function () {

        console.log(
            "🎤 Microphone started"
        );

        isRecording = true;

        updateVisuals("listening");
    };


    recognition.onend = function () {

        console.log(
            "🎤 Recognition ended"
        );

        isRecording = false;

        if (
            callActive &&
            !currentAudio &&
            !isProcessing
        ) {

            updateVisuals("idle");

        }

    };


    recognition.onerror = function (event) {

        console.error(
            "❌ Speech recognition error:",
            event.error
        );

        isRecording = false;


        if (event.error === "not-allowed") {

            alert(
                "Microphone permission was denied.\n\n" +
                "In Edge click the 🔒 icon near the address bar → Microphone → Allow → reload the page."
            );

            return;
        }


        if (event.error === "no-speech") {

            console.log(
                "No speech detected."
            );

            if (callActive) {

                setTimeout(
                    triggerListening,
                    800
                );

            }

            return;
        }


        if (callActive) {

            setTimeout(
                triggerListening,
                1000
            );

        }

    };


    recognition.onresult = function (event) {

        const text =
            event.results[0][0].transcript.trim();


        console.log(
            "👤 USER SAID:",
            text
        );


        if (!text) {

            triggerListening();

            return;
        }


        showTranscript(
            "You: " + text
        );


        handleBackendComm(text);

    };

}


/* =====================================================
   START CALL
====================================================== */

startCallBtn.addEventListener(
    "click",
    async function () {

        console.log(
            "======================================"
        );

        console.log(
            "🎤 START CALL CLICKED"
        );

        console.log(
            "======================================"
        );


        if (!SpeechRecognition) {

            alert(
                "Please use Microsoft Edge or Google Chrome."
            );

            return;
        }


        /*
         * IMPORTANT
         * Unlock Web Audio while we are still
         * inside the user's click event.
         */

        try {

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;


            audioContext =
                new AudioContextClass();


            if (
                audioContext.state ===
                "suspended"
            ) {

                await audioContext.resume();

            }


            console.log(
                "✅ AudioContext:",
                audioContext.state
            );

        } catch (error) {

            console.error(
                "❌ AudioContext error:",
                error
            );

        }


        /*
         * Ask for microphone permission
         */

        try {

            console.log(
                "🎤 Requesting microphone permission..."
            );


            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });


            console.log(
                "✅ Microphone permission granted"
            );


            /*
             * We only needed permission.
             * Stop this temporary stream.
             */

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );


        } catch (error) {

            console.error(
                "❌ Microphone permission error:",
                error
            );


            alert(
                "Microphone permission is required.\n\n" +
                "In Edge:\n" +
                "1. Click the 🔒 icon near 127.0.0.1\n" +
                "2. Find Microphone\n" +
                "3. Select Allow\n" +
                "4. Refresh the page"
            );

            return;
        }


        callActive = true;


        dashboard.classList.add(
            "hidden"
        );

        callScreen.classList.remove(
            "hidden"
        );


        startTimer();


        await initiateAgent();

    }
);


/* =====================================================
   CREATE SESSION
====================================================== */

async function initiateAgent() {

    try {

        console.log(
            "🆕 Creating new session..."
        );


        const initRes =
            await fetch(
                `${API_URL}/agent/new_session`,
                {
                    method: "POST"
                }
            );


        if (!initRes.ok) {

            throw new Error(
                "Unable to create session"
            );

        }


        const result =
            await initRes.json();


        sessionId =
            result.session_id;


        console.log(
            "✅ Session:",
            sessionId
        );


        const pName =
            inputName.value.trim();


        const pEmail =
            inputEmail.value.trim();


        /*
         * Send patient information
         */

        if (pName || pEmail) {

            showTranscript(
                `Patient: ${pName}`
            );


            await handleBackendComm(

                `[SYSTEM INFO: User Name is ${pName}, Email is ${pEmail}. Greet them by name.]`

            );

        } else {

            await handleBackendComm(
                "Hello"
            );

        }

    } catch (error) {

        console.error(
            "❌ SESSION ERROR:",
            error
        );


        showTranscript(
            "Unable to connect to Sarah."
        );


        updateVisuals(
            "idle"
        );

    }

}


/* =====================================================
   SEND MESSAGE TO FASTAPI
====================================================== */

async function handleBackendComm(text) {


    if (!callActive) {

        return;

    }


    if (!sessionId) {

        console.error(
            "❌ Session ID missing"
        );

        return;

    }


    if (isProcessing) {

        console.log(
            "⚠️ Already processing a message"
        );

        return;

    }


    isProcessing = true;


    console.log(
        "======================================"
    );

    console.log(
        "📤 Sending to backend:"
    );

    console.log(text);

    console.log(
        "======================================"
    );


    updateVisuals(
        "thinking"
    );


    try {


        const res =
            await fetch(
                `${API_URL}/agent/message`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            session_id:
                                sessionId,

                            text:
                                text,

                            language_code:
                                langSelect.value

                        })
                }
            );


        console.log(
            "📥 HTTP STATUS:",
            res.status
        );


        if (!res.ok) {

            throw new Error(
                `Backend HTTP ${res.status}`
            );

        }


        const data =
            await res.json();


        console.log(
            "📥 Backend response:",
            data
        );


        console.log(
            "======================================"
        );

        console.log(
            "AUDIO EXISTS:",
            !!data.audio
        );


        console.log(
            "AUDIO LENGTH:",
            data.audio
                ? data.audio.length
                : 0
        );


        console.log(
            "======================================"
        );


        /*
         * Show Sarah's text
         */

        if (data.text) {

            showTranscript(
                "Sarah: " + data.text
            );

        }


        /*
         * Play audio
         */

        if (
            data.audio &&
            data.audio.length > 100
        ) {

            console.log(
                "🔊 Audio received"
            );


            await playAudio(
                data.audio
            );

        } else {

            console.warn(
                "⚠️ No audio received"
            );


            isProcessing = false;


            setTimeout(
                triggerListening,
                500
            );

        }


    } catch (error) {


        console.error(
            "❌ BACKEND ERROR:",
            error
        );


        showTranscript(
            "Sarah: Sorry, I am having a technical problem."
        );


        isProcessing = false;


        updateVisuals(
            "idle"
        );


        setTimeout(
            triggerListening,
            1000
        );

    }

}


/* =====================================================
   PLAY AUDIO USING WEB AUDIO API
====================================================== */

async function playAudio(base64Audio) {


    console.log(
        "======================================"
    );

    console.log(
        "🔊 PLAY AUDIO START"
    );

    console.log(
        "Audio length:",
        base64Audio.length
    );

    console.log(
        "======================================"
    );


    updateVisuals(
        "speaking"
    );


    try {


        /*
         * Make sure AudioContext exists
         */

        if (!audioContext) {

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;


            audioContext =
                new AudioContextClass();

        }


        /*
         * Resume AudioContext
         */

        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        console.log(
            "AudioContext state:",
            audioContext.state
        );


        /*
         * Stop previous audio
         */

        if (currentSource) {

            try {

                currentSource.stop();

            } catch (e) {

            }

            currentSource =
                null;

        }


        if (currentAudio) {

            try {

                currentAudio.pause();

                currentAudio.currentTime = 0;

            } catch (e) {

            }

            currentAudio =
                null;

        }


        /*
         * Convert base64 to binary
         */

        const binaryString =
            atob(base64Audio);


        const len =
            binaryString.length;


        const bytes =
            new Uint8Array(len);


        for (
            let i = 0;
            i < len;
            i++
        ) {

            bytes[i] =
                binaryString.charCodeAt(i);

        }


        console.log(
            "✅ Base64 converted"
        );


        /*
         * Decode MP3
         */

        const audioBuffer =
            await audioContext.decodeAudioData(
                bytes.buffer
            );


        console.log(
            "✅ Audio decoded"
        );


        console.log(
            "Duration:",
            audioBuffer.duration,
            "seconds"
        );


        /*
         * Create Web Audio source
         */

        currentSource =
            audioContext.createBufferSource();


        currentSource.buffer =
            audioBuffer;


        /*
         * Volume control
         */

        const gainNode =
            audioContext.createGain();


        gainNode.gain.value =
            1.0;


        currentSource.connect(
            gainNode
        );


        gainNode.connect(
            audioContext.destination
        );


        /*
         * When Sarah finishes
         */

        currentSource.onended =
            function () {

                console.log(
                    "✅ SARAH FINISHED SPEAKING"
                );


                currentSource =
                    null;


                isProcessing =
                    false;


                updateVisuals(
                    "idle"
                );


                if (callActive) {

                    setTimeout(
                        triggerListening,
                        500
                    );

                }

            };


        /*
         * PLAY
         */

        currentSource.start(0);


        console.log(
            "======================================"
        );

        console.log(
            "✅ SARAH IS SPEAKING"
        );

        console.log(
            "======================================"


        );


    } catch (error) {


        console.error(
            "❌ WEB AUDIO ERROR:",
            error
        );


        /*
         * Fallback to normal Audio()
         */

        try {

            console.log(
                "🔄 Trying HTML Audio fallback..."
            );


            const audioUrl =
                "data:audio/mp3;base64," +
                base64Audio;


            currentAudio =
                new Audio(
                    audioUrl
                );


            currentAudio.volume =
                1.0;


            currentAudio.onplay =
                function () {

                    console.log(
                        "✅ HTML AUDIO PLAYING"
                    );

                    updateVisuals(
                        "speaking"
                    );

                };


            currentAudio.onended =
                function () {

                    console.log(
                        "✅ HTML AUDIO FINISHED"
                    );


                    currentAudio =
                        null;


                    isProcessing =
                        false;


                    updateVisuals(
                        "idle"
                    );


                    setTimeout(
                        triggerListening,
                        500
                    );

                };


            await currentAudio.play();


            console.log(
                "✅ HTML AUDIO PLAY SUCCESS"
            );


        } catch (fallbackError) {


            console.error(
                "❌ HTML AUDIO PLAY ERROR:",
                fallbackError
            );


            console.error(
                "The browser blocked audio playback."
            );


            showTranscript(
                "Sarah: Voice playback was blocked by the browser."
            );


            isProcessing =
                false;


            updateVisuals(
                "idle"
            );


            /*
             * Continue listening
             */

            setTimeout(
                triggerListening,
                1000
            );

        }

    }

}


/* =====================================================
   START MICROPHONE
====================================================== */

function triggerListening() {


    if (!callActive) {

        return;

    }


    if (!recognition) {

        console.error(
            "❌ Recognition unavailable"
        );

        return;

    }


    if (isRecording) {

        console.log(
            "🎤 Already listening"
        );

        return;

    }


    if (isProcessing) {

        console.log(
            "🧠 Still processing..."
        );

        return;

    }


    try {


        recognition.lang =
            langSelect.value;


        console.log(
            "🎤 Starting recognition:",
            recognition.lang
        );


        recognition.start();


    } catch (error) {


        console.warn(
            "⚠️ Recognition start error:",
            error
        );


        /*
         * Browser sometimes says recognition
         * is already running.
         */

        if (
            !error.message.includes(
                "already started"
            )
        ) {

            setTimeout(
                triggerListening,
                1000
            );

        }

    }

}


/* =====================================================
   SHOW TRANSCRIPT
====================================================== */

function showTranscript(text) {


    transcriptBox.classList.remove(
        "hidden"
    );


    transcriptText.innerText =
        text;


    transcriptBox.style.opacity =
        "1";


    transcriptBox.style.transform =
        "translateY(0)";

}


/* =====================================================
   VISUAL STATE
====================================================== */

function updateVisuals(state) {


    visualRing.className =
        "glowing-ring";


    statusIcon.className =
        "";


    if (
        state === "listening"
    ) {


        visualRing.classList.add(
            "ring-listening"
        );


        statusIcon.className =
            "fa-solid fa-microphone text-6xl text-green-500";


        agentStatus.innerText =
            "Listening...";


        muteBtn.classList.add(
            "bg-green-600"
        );


        muteIcon.className =
            "fa-solid fa-microphone";


    }


    else if (
        state === "thinking"
    ) {


        visualRing.classList.add(
            "ring-idle"
        );


        statusIcon.className =
            "fa-solid fa-brain text-6xl text-purple-500 animate-pulse";


        agentStatus.innerText =
            "Sarah is thinking...";


        muteBtn.classList.remove(
            "bg-green-600"
        );


    }


    else if (
        state === "speaking"
    ) {


        visualRing.classList.add(
            "ring-speaking"
        );


        statusIcon.className =
            "fa-solid fa-volume-high text-6xl text-pink-500";


        agentStatus.innerText =
            "Sarah is speaking...";


        muteBtn.classList.remove(
            "bg-green-600"
        );


    }


    else {


        visualRing.classList.add(
            "ring-idle"
        );


        statusIcon.className =
            "fa-solid fa-wave-square text-6xl text-gray-600 opacity-50";


        agentStatus.innerText =
            "Ready";


        muteBtn.classList.remove(
            "bg-green-600"
        );

    }

}


/* =====================================================
   CALL TIMER
====================================================== */

function startTimer() {


    let seconds =
        0;


    callTimer.innerText =
        "00:00";


    clearInterval(
        timerInterval
    );


    timerInterval =
        setInterval(
            function () {


                seconds++;


                const minutes =
                    Math.floor(
                        seconds / 60
                    );


                const secs =
                    seconds % 60;


                callTimer.innerText =

                    String(minutes)
                        .padStart(2, "0")

                    + ":" +

                    String(secs)
                        .padStart(2, "0");


            },
            1000
        );

}


/* =====================================================
   MUTE BUTTON
====================================================== */

muteBtn.addEventListener(
    "click",
    function () {


        if (!recognition) {

            return;

        }


        if (isRecording) {


            console.log(
                "🔇 Microphone stopped"
            );


            try {

                recognition.stop();

            } catch (e) {

            }


            isRecording =
                false;


            muteIcon.className =
                "fa-solid fa-microphone-slash";


            muteBtn.classList.remove(
                "bg-green-600"
            );


            updateVisuals(
                "idle"
            );


        } else {


            console.log(
                "🎤 Microphone starting"
            );


            muteIcon.className =
                "fa-solid fa-microphone";


            triggerListening();

        }

    }
);


/* =====================================================
   END CALL
====================================================== */

endCallBtn.addEventListener(
    "click",
    function () {


        console.log(
            "📞 END CALL"
        );


        callActive =
            false;


        isProcessing =
            false;


        clearInterval(
            timerInterval
        );


        /*
         * Stop recognition
         */

        if (recognition) {

            try {

                recognition.stop();

            } catch (e) {

            }

        }


        /*
         * Stop Web Audio
         */

        if (currentSource) {

            try {

                currentSource.stop();

            } catch (e) {

            }

            currentSource =
                null;

        }


        /*
         * Stop HTML audio
         */

        if (currentAudio) {

            try {

                currentAudio.pause();

            } catch (e) {

            }

            currentAudio =
                null;

        }


        /*
         * Return to dashboard
         */

        callScreen.classList.add(
            "hidden"
        );


        dashboard.classList.remove(
            "hidden"
        );


        sessionId =
            null;


        updateVisuals(
            "idle"
        );

    }
);


/* =====================================================
   LANGUAGE CHANGE
====================================================== */

langSelect.addEventListener(
    "change",
    function () {


        console.log(
            "🌐 Language changed:",
            langSelect.value
        );

    }
);


/* =====================================================
   PAGE LOAD
====================================================== */

window.addEventListener(
    "load",
    function () {

        console.log(
            "======================================"
        );

        console.log(
            "Sarah AI Receptionist Ready"
        );

        console.log(
            "Speech Recognition:",
            !!SpeechRecognition
        );

        console.log(
            "======================================"
        );

    }
);

</script>
